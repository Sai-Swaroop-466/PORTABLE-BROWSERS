name: Build Vivaldi Portable

on:
  schedule:
    - cron: "37 * * * *"   # every hour
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this version already exists"
        type: boolean
        default: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Detect latest official Vivaldi version
        id: v
        run: |
          FILE=$(curl -fsSL https://update.vivaldi.com/update/1.0/public/appcast.x64.xml \
                 | grep -oE 'Vivaldi\.[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.x64\.exe' | head -1 || true)
          if [ -z "$FILE" ]; then
            FILE=$(curl -fsSL https://vivaldi.com/download/ \
                   | grep -oE 'Vivaldi\.[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.x64\.exe' | head -1 || true)
          fi
          [ -n "$FILE" ] || { echo "Could not detect Vivaldi version"; exit 1; }
          VER=$(echo "$FILE" | sed -E 's/Vivaldi\.(.*)\.x64\.exe/\1/')
          TAG="vivaldi-$VER"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "Already built $TAG"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build launcher
        if: steps.v.outputs.build == 'true'
        run: |
          cd launcher
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui -X main.App=vivaldi -X main.Repo=${{ github.repository }}" -o ../vivaldi-portable.exe .

      - name: Download official installer and extract
        if: steps.v.outputs.build == 'true'
        run: |
          sudo apt-get install -y p7zip-full >/dev/null
          curl -fSL -o installer.exe "https://downloads.vivaldi.com/stable/${{ steps.v.outputs.file }}"
          mkdir ex && cd ex
          7z x ../installer.exe -y >/dev/null
          for i in 1 2 3; do
            [ -n "$(find . -iname vivaldi.exe | head -1)" ] && break
            A=$(find . -iname '*.7z' | head -1)
            [ -n "$A" ] || break
            7z x "$A" -o"$(dirname "$A")" -y >/dev/null
            rm -f "$A"
          done
          VEXE=$(find . -iname vivaldi.exe | head -1)
          [ -n "$VEXE" ] || { echo "vivaldi.exe not found"; find . | head -50; exit 1; }
          echo "SRC=$PWD/$(dirname "$VEXE")" >> "$GITHUB_ENV"

      - name: Package
        if: steps.v.outputs.build == 'true'
        run: |
          mkdir -p out/VivaldiPortable/App
          cp -r "$SRC"/. out/VivaldiPortable/App/
          cp vivaldi-portable.exe out/VivaldiPortable/
          echo "${{ steps.v.outputs.tag }}" > out/VivaldiPortable/App/version.txt
          [ -f version.dll ] || { echo 'version.dll missing from repo root'; exit 1; }
          cp version.dll out/VivaldiPortable/App/version.dll
          cd out
          zip -r -9 -q ../VivaldiPortable-windows-x64.zip VivaldiPortable
          cd ..
          sha256sum VivaldiPortable-windows-x64.zip > VivaldiPortable-windows-x64.zip.sha256

      - name: Publish release
        if: steps.v.outputs.build == 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" VivaldiPortable-windows-x64.zip VivaldiPortable-windows-x64.zip.sha256 \
            --title "Vivaldi Portable ${{ steps.v.outputs.ver }}" \
            --notes "Portable build of Vivaldi ${{ steps.v.outputs.ver }} (from downloads.vivaldi.com). Extract and run vivaldi-portable.exe."
