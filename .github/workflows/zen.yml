name: Build Zen Portable

on:
  schedule:
    - cron: "7 * * * *"   # every hour
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this version already exists"
        type: boolean
        default: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Detect latest official Zen version
        id: v
        run: |
          # Same release the official site (zen-browser.app) links to
          VER=$(curl -fsSIL -o /dev/null -w '%{url_effective}' https://github.com/zen-browser/desktop/releases/latest | sed 's#.*/tag/##')
          [ -n "$VER" ] || { echo "version detect failed"; exit 1; }
          TAG="zen-$VER"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "Already built $TAG"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build launcher
        if: steps.v.outputs.build == 'true'
        run: |
          cd launcher
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui -X main.App=zen -X main.Repo=${{ github.repository }}" -o ../zen-portable.exe .

      - name: Download official installer and extract
        if: steps.v.outputs.build == 'true'
        run: |
          sudo apt-get install -y p7zip-full >/dev/null
          curl -fSL -o zen.installer.exe "https://github.com/zen-browser/desktop/releases/download/${{ steps.v.outputs.ver }}/zen.installer.exe"
          7z x zen.installer.exe -ozen_extract -y >/dev/null
          ZEXE=$(find zen_extract -iname zen.exe | head -1)
          [ -n "$ZEXE" ] || { echo "zen.exe not found"; find zen_extract | head -50; exit 1; }
          echo "SRC=$(dirname "$ZEXE")" >> "$GITHUB_ENV"

      - name: Package
        if: steps.v.outputs.build == 'true'
        run: |
          mkdir -p out/ZenPortable/App
          cp -r "$SRC"/. out/ZenPortable/App/
          cp zen-portable.exe out/ZenPortable/
          echo "${{ steps.v.outputs.tag }}" > out/ZenPortable/App/version.txt
          cd out
          zip -r -9 -q ../ZenPortable-windows-x64.zip ZenPortable
          cd ..
          sha256sum ZenPortable-windows-x64.zip > ZenPortable-windows-x64.zip.sha256

      - name: Publish release
        if: steps.v.outputs.build == 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" ZenPortable-windows-x64.zip ZenPortable-windows-x64.zip.sha256 \
            --title "Zen Portable ${{ steps.v.outputs.ver }}" \
            --notes "Portable build of Zen Browser ${{ steps.v.outputs.ver }} (from the official release). Extract and run zen-portable.exe."
